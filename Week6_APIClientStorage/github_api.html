<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GitHub API</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                Week 6 Laboratory

            </a>


            <a href="index.html"
               class="btn btn-outline-light btn-sm">

                Home

            </a>

        </div>

    </nav>


    <section class="page-header">

        <h1>GitHub User Lookup</h1>

        <p>
            Fetch public GitHub user information using the GitHub API.
        </p>

    </section>


    <main class="container py-5">

        <div class="content-box shadow-sm">

            <label for="username"
                   class="form-label">

                Enter GitHub Username:

            </label>


            <input type="text"
                   id="username"
                   class="form-control mb-3"
                   placeholder="Example: octocat">


            <button onclick="getUser()"
                    class="btn btn-dark">

                Get User

            </button>


            <div id="userResult"
                 class="mt-4">

            </div>

        </div>

    </main>


    <script>

        function getUser() {

            let username =
                document.getElementById("username").value;


            if (username === "") {

                document.getElementById("userResult").innerHTML =
                    "<p>Please enter a GitHub username.</p>";

                return;

            }


            let url =
                `https://api.github.com/users/${username}`;


            fetch(url)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("GitHub user not found.");
                    }

                    return response.json();

                })

                .then(data => {

                    document.getElementById("userResult").innerHTML = `

                        <div class="card shadow-sm">

                            <div class="card-body">

                                <img
                                    src="${data.avatar_url}"
                                    width="120"
                                    class="rounded-circle mb-3"
                                    alt="GitHub Avatar">


                                <h2>
                                    ${data.name || "No Name Found"}
                                </h2>


                                <p>
                                    Username:
                                    ${data.login}
                                </p>


                                <p>
                                    Public Repositories:
                                    ${data.public_repos}
                                </p>


                                <p>
                                    Followers:
                                    ${data.followers}
                                </p>


                                <p>
                                    Following:
                                    ${data.following}
                                </p>


                                <a
                                    href="${data.html_url}"
                                    target="_blank"
                                    class="btn btn-dark">

                                    View GitHub Profile

                                </a>

                            </div>

                        </div>

                    `;

                })

                .catch(error => {

                    document.getElementById("userResult").innerHTML =
                        `<p class="text-danger">${error.message}</p>`;

                });

        }

    </script>


</body>
</html>

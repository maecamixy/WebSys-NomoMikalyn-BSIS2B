<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Maps API</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container-box {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        #map {
            width: 100%;
            height: 500px;
            margin-top: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container-box">

        <h2 class="mb-4">Google Maps API</h2>

        <div class="mb-3">
            <label for="location" class="form-label">Enter Location:</label>

            <input
                type="text"
                id="location"
                class="form-control"
                value="Manila"
                placeholder="Enter a city or address"
            >
        </div>

        <button
            type="button"
            class="btn btn-dark"
            onclick="searchLocation()">
            Search Location
        </button>

        <div id="map"></div>

    </div>


    <script>
        let map;
        let marker;
        let geocoder;

        function initMap() {

            const defaultLocation = {
                lat: 14.5995,
                lng: 120.9842
            };

            map = new google.maps.Map(document.getElementById("map"), {
                center: defaultLocation,
                zoom: 12
            });

            marker = new google.maps.Marker({
                position: defaultLocation,
                map: map
            });

            geocoder = new google.maps.Geocoder();
        }


        function searchLocation() {

            const location = document.getElementById("location").value;

            if (location.trim() === "") {
                alert("Please enter a location.");
                return;
            }

            geocoder.geocode(
                {
                    address: location
                },
                function(results, status) {

                    if (status === "OK") {

                        const position = results[0].geometry.location;

                        map.setCenter(position);
                        map.setZoom(14);

                        marker.setPosition(position);

                    } else {

                        alert(
                            "Location could not be found. Please try again."
                        );

                    }
                }
            );
        }
    </script>


    <script
        async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDA1TU4Wc6RVY4_WfokAg8aHodvyI-YBZo&callback=initMap">
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Storage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                Week 6 Laboratory
            </a>

            <div>
                <a class="btn btn-outline-light btn-sm" href="index.html">
                    Home
                </a>
            </div>

        </div>
    </nav>


    <main>

        <section class="page-header">
            <h1>Local Storage</h1>
            <p>Save and retrieve user data using JavaScript.</p>
        </section>


        <section class="container py-5">

            <div class="content-box shadow-sm">

                <h2 class="mb-4">Save User Preferences</h2>

                <label for="username" class="form-label">
                    Enter Name:
                </label>

                <input type="text"
                       id="username"
                       class="form-control mb-3"
                       placeholder="Enter your name">

                <button onclick="saveData()" class="btn btn-dark">
                    Save
                </button>

                <button onclick="loadData()" class="btn btn-secondary">
                    Load
                </button>

                <p id="display" class="mt-4 fw-bold"></p>

            </div>

        </section>

    </main>


    <script>

        function saveData() {

            let name = document.getElementById("username").value;

            localStorage.setItem("userName", name);

            alert("Data Saved!");

        }


        function loadData() {

            let name = localStorage.getItem("userName");

            if (name) {
                document.getElementById("display").innerText =
                    "Welcome, " + name;
            } else {
                document.getElementById("display").innerText =
                    "No data saved!";
            }

        }

    </script>

</body>
</html>
